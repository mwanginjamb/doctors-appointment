# Runs every test suite (common, frontend, backend) on each push and pull request.
# Gitea Actions: needs a runner with Docker and the `ubuntu-latest` label (see docs/FEATURES.md, T4).
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: yii2advanced_test
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      # The job runs in a container next to the MySQL service, which it reaches by name.
      TEST_DB_HOST: mysql

    steps:
      # Full URLs, so the actions resolve whatever the Gitea server's default actions source is.
      - uses: https://github.com/actions/checkout@v4

      - name: Set up PHP 8.3 (as on the server)
        uses: https://github.com/shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, gd, zip, bcmath, curl, openssl
          coverage: none
          tools: composer:v2

      - name: Find the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: https://github.com/actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Configure the app for tests
        run: |
          php init --env=Development --overwrite=All
          # The generated test config points at localhost; point it at the MySQL service.
          cat > common/config/test-local.php <<PHP
          <?php
          return [
              'components' => [
                  'db' => [
                      'dsn' => 'mysql:host=${TEST_DB_HOST};dbname=yii2advanced_test',
                      'username' => 'root',
                      'password' => '',
                  ],
              ],
          ];
          PHP

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 60); do
            php -r 'new PDO("mysql:host=" . getenv("TEST_DB_HOST") . ";dbname=yii2advanced_test", "root", "");' 2>/dev/null && exit 0
            sleep 2
          done
          echo "MySQL did not start in time" >&2
          exit 1

      - name: Create the test database
        run: |
          php yii_test migrate --migrationPath=@yii/rbac/migrations --interactive=0
          php yii_test migrate --migrationNamespaces='yii\queue\db\migrations' --interactive=0
          php yii_test rbac/init

      - name: Run the tests
        run: vendor/bin/codecept run --no-colors

      - name: Keep the test output when something fails
        if: failure()
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: codeception-output
          path: console/runtime/output
          if-no-files-found: ignore
