# nginx site for GlitchTip on its own subdomain (change errors.example.co.ke).
#
#   sudo cp glitchtip.nginx.conf /etc/nginx/sites-available/glitchtip
#   sudo ln -s /etc/nginx/sites-available/glitchtip /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d errors.example.co.ke     # HTTPS
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name errors.example.co.ke;

    # Error reports can carry long stack traces
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
