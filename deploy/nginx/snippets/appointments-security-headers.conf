# Security headers for appointments.gumzpsystems.tech
#
# Install to: /etc/nginx/snippets/appointments-security-headers.conf
#
# NOTE: nginx's add_header is NOT inherited by a location block that defines
# its own add_header. Every location that sets add_header (e.g. Cache-Control)
# must `include` this file again, which is why it lives in a snippet.

# Force HTTPS for 2 years. "preload" is deliberately omitted: preloading must be
# requested for the apex domain (gumzpsystems.tech) and affects every subdomain.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Stop MIME sniffing.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking protection (legacy header; CSP frame-ancestors below is the modern one).
add_header X-Frame-Options "DENY" always;

# Send only the origin to other sites, full URL within this site.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Turn off browser features the app does not use.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;

# Isolate the browsing context from cross-origin windows, but let it open popups:
# Google One Tap may finish in a Google popup (Safari), which "same-origin" would break.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Block Adobe Flash/PDF cross-domain policy files.
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Content Security Policy, built from the app's external dependencies:
#   scripts : cdn.jsdelivr.net (select2), cdn.datatables.net, cdnjs.cloudflare.com
#             (FullCalendar), www.gstatic.com (Firebase SDK)
#   styles  : fonts.googleapis.com, cdn.jsdelivr.net (bootstrap-icons, select2),
#             cdn.datatables.net
#   fonts   : fonts.gstatic.com, cdn.jsdelivr.net (bootstrap-icons font files)
#   images  : https: (Google/LinkedIn OAuth avatars, placehold.co fallbacks)
#   connect : Firebase Cloud Messaging / Installations endpoints
#   google  : accounts.google.com/gsi (Google One Tap: script, style, its frame, its calls)
#   forms   : OAuth providers (redirects after form posts are checked against this)
# 'unsafe-inline' is still needed for scripts and styles: Yii's registerJs(),
# ActiveForm client validation and the layouts emit inline <script>/style attrs.
# To drop it, move to nonces (e.g. a CSP nonce generated in a Yii beforeAction).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.datatables.net https://cdnjs.cloudflare.com https://www.gstatic.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdn.datatables.net https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://www.gstatic.com https://fcm.googleapis.com https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; frame-src https://accounts.google.com/gsi/; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com https://www.linkedin.com; upgrade-insecure-requests" always;
