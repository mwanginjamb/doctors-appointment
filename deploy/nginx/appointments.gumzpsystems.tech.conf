# nginx site config for the doctor-appointments Yii2 app
#
# Install to: /etc/nginx/sites-available/appointments.gumzpsystems.tech.conf
#             (symlink into sites-enabled) and copy
#             snippets/appointments-security-headers.conf to /etc/nginx/snippets/
#
# Assumptions — adjust before going live:
#   * App deployed at /var/www/doctor-appointments (root = frontend/web)
#   * PHP-FPM listening on unix:/run/php/php8.3-fpm.sock
#   * TLS certificate issued by certbot (Let's Encrypt) for this hostname
#   * `php init --env=Production` has been run, so index-test.php is absent
#     and YII_DEBUG / YII_ENV_DEV are off
#
# The admin area is part of the frontend app, so only frontend/web is served.
# The stock backend/ app is intentionally not exposed.

# ---------------------------------------------------------------------------
# Rate limiting (http context — this file is included inside http {})
# ---------------------------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=appt_auth:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=appt_general:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=appt_conn:10m;

# ---------------------------------------------------------------------------
# HTTP → HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name appointments.gumzpsystems.tech;

    server_tokens off;

    # Let's Encrypt HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    # "listen ... http2" works on all nginx versions (deprecated-but-accepted on
    # >= 1.25.1, where "http2 on;" is the new form).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name appointments.gumzpsystems.tech;

    root  /var/www/doctor-appointments/frontend/web;
    index index.php;
    charset utf-8;

    # --- TLS -----------------------------------------------------------------
    ssl_certificate         /etc/letsencrypt/live/appointments.gumzpsystems.tech/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/appointments.gumzpsystems.tech/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/appointments.gumzpsystems.tech/chain.pem;

    # Mozilla "intermediate" profile
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AppointmentsSSL:10m;
    ssl_session_tickets off;
    # OCSP stapling omitted: Let's Encrypt ended OCSP in 2025, so stapling only
    # produces "no OCSP responder URL" warnings with its certificates.

    # --- General hardening ---------------------------------------------------
    server_tokens off;
    client_max_body_size 10m;       # profile/appointment uploads
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn appt_conn 30;

    # Only methods the app uses
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    include snippets/appointments-security-headers.conf;

    # --- Logging -------------------------------------------------------------
    access_log /var/log/nginx/appointments.access.log;
    error_log  /var/log/nginx/appointments.error.log warn;

    # --- Compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # --- Deny sensitive files ------------------------------------------------
    # Dotfiles (.env, .git, .htaccess …) except the ACME directory
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Backups, configs, source and dependency manifests that should never be served
    location ~* \.(bak|backup|old|orig|save|swp|sql|sqlite|log|ini|conf|env|dist|yml|yaml|lock|md|sh|config)$ {
        deny all;
    }
    location ~* /(composer\.(json|lock)|package(-lock)?\.json|web\.config)$ {
        deny all;
    }

    # Never run test entry points in production
    location = /index-test.php {
        deny all;
    }

    # --- Static assets -------------------------------------------------------
    # Yii-published bundles live in hashed directories, so they can be cached hard.
    location ^~ /assets/ {
        location ~ \.php$ { deny all; }
        try_files $uri =404;
        expires 1y;
        include snippets/appointments-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Firebase messaging service worker must always be revalidated so updates ship.
    location = /firebase-messaging-sw.js {
        try_files $uri =404;
        include snippets/appointments-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js|mjs|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        include snippets/appointments-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    # --- Brute-force protection on auth endpoints ---------------------------
    location ~ ^/site/(login|signup|request-password-reset|reset-password|resend-verification-email|contact|auth)(/|$) {
        limit_req zone=appt_auth burst=5 nodelay;
        limit_req_status 429;
        try_files $uri /index.php$is_args$args;
    }

    # --- Front controller ----------------------------------------------------
    location / {
        limit_req zone=appt_general burst=40 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Only index.php is executable; any other .php file returns 404.
    location = /index.php {
        try_files $uri =404;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";            # httpoxy mitigation

        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }
}
